[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
version_file = "silica/_version.py"
# The plugin marketplace copies this tree into ~/.claude/plugins/cache
# without .git, and mcp.json builds it there, so version inference has
# no tags to read and raised, taking the whole MCP server down with it.
fallback_version = "0.0.0"

[project]
name = "silica-harness"
dynamic = ["version"]
description = "Retrieval tools for coding agents: files, search, read, code_pack, write_note over a folder, no model in the loop"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
authors = [{ name = "Alessandro Carosia" }]
classifiers = [
  "Environment :: Console",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Text Processing",
]
dependencies = [
  "httpx",
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "networkx>=3",
  "markdown-it-py",
  # Serializer for every derived store; measured 5x faster than json on a
  # 108 MB index at every flush (ADR-0037 in the private tree).
  "orjson",
  "snowballstemmer",
  "stop-words>=2025.11.4",
  "tree-sitter>=0.25",
  "tree-sitter-language-pack>=1.13",
  # PDF text layer (BSD-3/Apache-2.0, one ~3 MB wheel). Scans need mineru,
  # installed separately and called as a command.
  "pypdfium2>=5",
  "mammoth>=1.9",
  "striprtf>=0.0.29",
  "xlrd>=2.0",
  # The tabular tools (--extended): DuckDB over CSV/XLSX/…, one wheel.
  "duckdb>=1.5.5",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "mypy>=1.10", "import-linter>=2.0", "ruff>=0.16"]
connect = ["websockets>=16.0"]
mcp = ["mcp>=1.0,<2"]
all = ["silica-harness[connect,mcp]"]

[project.scripts]
silica = "silica.entry:main"

[project.urls]
Homepage = "https://github.com/kiycoh/silica-harness"
Repository = "https://github.com/kiycoh/silica-harness"
Issues = "https://github.com/kiycoh/silica-harness/issues"

[tool.setuptools]
# skills/ is a non-package subdir of silica (the harness skill the setup
# command installs): include-package-data ships it with the wheel.
include-package-data = true

[tool.setuptools.packages.find]
include = ["silica", "silica.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# Dead code, not style. Measured 2026-09-03 over 711 files: this select reports
# 190 findings (158 of them unused imports), ruff's own default select reports
# 2245 — and those extra 2055 are churn that rewrites rationale comments and
# git blame to buy nothing. Widen only for a one-shot audit, never for the gate:
# --select BLE001 alone reports 594 blind excepts, which is the CLAUDE.md
# "a swallowed exception must name what it tolerates" rule. That is a work list,
# not a merge blocker.
select = ["F", "E9"]

[tool.importlinter]
root_packages = ["silica"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "the kernel, the driver and the converters never import a surface"
type = "forbidden"
source_modules = ["silica.kernel", "silica.driver", "silica.sources"]
forbidden_modules = ["silica.core", "silica.cli", "silica.ui", "silica.onboarding"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "the core never reaches the driver or a surface"
type = "forbidden"
source_modules = ["silica.core"]
forbidden_modules = ["silica.driver", "silica.cli", "silica.ui", "silica.onboarding"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "the kernel makes no network call"
type = "forbidden"
source_modules = ["silica.kernel"]
forbidden_modules = ["httpx", "websockets"]
allow_indirect_imports = true

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = [
    "yaml", "yaml.*", "networkx", "networkx.*",
    # PDF providers, all three installed by the user, none a dependency here:
    "docling.*", "docling_core.*", "opendataloader_pdf", "mammoth", "mammoth.*",
    "pypdfium2", "pypdfium2.*",
    # Legacy office readers: both ship no stubs (xlrd has been feature-frozen
    # since 2.0 dropped .xlsx, which is exactly why it is safe to depend on).
    "xlrd", "striprtf.*",
    # No stubs and no py.typed: the NLP pair (stop-words, snowballstemmer)
    # plus three that DO have stub packages on PyPI — types-python-dateutil,
    # types-Pygments, types-openpyxl. Listed here rather than installed because
    # each is reached from one narrow call site; add the stub package instead if
    # any of these three ever grows a real surface.
    "stop_words", "snowballstemmer",
    "dateutil.*", "pygments", "pygments.*", "openpyxl", "openpyxl.*",
    # The [rerank] extra's cross-encoder. Listed for the same reason the PDF
    # providers are: ci.yml deliberately syncs without it (3.8 GB of torch to
    # run tests that skip), so mypy would fail on a package the gate is not
    # meant to install — and did, on every push, while passing on a checkout
    # that happened to have the extra.
    "sentence_transformers", "sentence_transformers.*",
]
ignore_missing_imports = true
