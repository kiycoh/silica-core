# The redirect for the previous distribution name. `silica-harness` shipped
# 0.5.0 to 0.6.1 before the public core was renamed
# to `silica-core` (2026-09-08). PyPI has no forwarding: without this,
# `pip install -U silica-harness` keeps resolving to 0.6.1 forever and never
# says why. packaging/silica-agent is the same shim for the oldest name.
#
# Deliberately NOT deleted from PyPI instead. Deleting frees the name for
# anyone to register, and a package that reads the user's files is worth
# squatting; the release that follows a deletion is the supply-chain attack.
#
# No modules of its own: the wheel is metadata plus the console script, which
# resolves against the `silica` package that `silica-core` installs. That
# keeps `uv tool install silica-harness` and `pipx install silica-harness` working
# rather than leaving them with a tool that has no executable.
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "silica-harness"
version = "0.7.0"
description = "Renamed to silica-core. This package installs it."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Alessandro Carosia" }]
keywords = ["retrieval", "search", "bm25", "mcp", "agents"]
classifiers = [
  "Environment :: Console",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Text Processing",
]
# `>=` and not `==`: one shim release has to keep redirecting to every version
# that follows it, so `uv tool upgrade silica-harness` re-resolves to the current
# silica-core instead of pinning whatever was newest the day this shipped.
# 0.6.2 is the lowest version the new name can carry (setuptools-scm counts
# from the last silica-harness tag), whatever the first silica-core tag is.
dependencies = ["silica-core>=0.6.2"]

[project.urls]
Homepage = "https://github.com/kiycoh/silica-core"
Repository = "https://github.com/kiycoh/silica-core"
Issues = "https://github.com/kiycoh/silica-core/issues"

[project.scripts]
silica = "silica.entry:main"

[tool.setuptools]
# Nothing to find: this distribution owns no import package. Stated rather than
# left to autodiscovery, which would otherwise walk the repo root above it.
packages = []
