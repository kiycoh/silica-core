name: release

# Cut a release by bumping the plugin manifests, then pushing a SemVer tag:
#   v=0.7.2
#   sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$v\"/" \
#     .claude-plugin/plugin.json .codex-plugin/plugin.json server.json
#   git commit -am "chore(plugin): the manifests and the registry entry declare $v"
#   git tag "v$v" && git push origin main "v$v"
# setuptools-scm reads the tag to stamp the version; git-cliff builds the notes.
# The manifests stay hand-bumped because a harness reads them from the commit,
# never from this run: the first step below refuses to ship when they drift.

on:
  push:
    tags:
      - "v*"

permissions: {}   # the one job below asks for what it needs; nothing inherits

concurrency:
  # Never cancel a publish in flight: half a release is worse than a late one.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # Scopes the Trusted Publishing OIDC to this environment (set the same name
    # on the PyPI publisher for the narrowing to be real), and gives the repo
    # one checkbox, required reviewers, to make a stray tag push wait for a
    # human instead of shipping.
    environment:
      name: pypi
      url: https://pypi.org/p/silica-core
    permissions:
      contents: write   # create the GitHub Release
      id-token: write   # OIDC for PyPI Trusted Publishing (no stored token)
    steps:
      # Actions are pinned by commit, not by tag: this job holds a token that
      # can publish to PyPI, and a tag is mutable. Dependabot (github-actions,
      # weekly) bumps the pins and rewrites the version comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # full history + tags for setuptools-scm and git-cliff

      # v0.7.0 and v0.7.1 both shipped with the manifests still declaring 0.6.1,
      # so every plugin install stayed pinned to the 0.6.1 tree: the cache is
      # keyed on that string and saw no reason to refresh. Cheapest step in the
      # job, and first, so the drift costs ten seconds instead of a burned
      # version number.
      - name: Verify the plugin manifests match the tag
        run: |
          want="${GITHUB_REF_NAME#v}"
          for m in .claude-plugin/plugin.json .codex-plugin/plugin.json; do
            got=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['version'])" "$m")
            [ "$got" = "$want" ] || { echo "$m declares $got, tag is $want"; exit 1; }
          done

      # The same drift, one registry further out: server.json carries the
      # version twice (the server's and the PyPI package's) and the registry
      # rejects a package version PyPI does not have, so both track the tag.
      # The marker travels with them — ownership is proven by finding it in the
      # description PyPI renders, and a README edit can drop it silently.
      - name: Verify the registry entry matches the tag
        run: |
          python3 - "${GITHUB_REF_NAME#v}" <<'PY'
          import json, sys
          want = sys.argv[1]
          d = json.load(open("server.json"))
          got = [d["version"], d["packages"][0]["version"]]
          if got != [want, want]:
              sys.exit(f"server.json declares {got}, tag is {want}")
          if f"<!-- mcp-name: {d['name']} -->" not in open("README.md").read():
              sys.exit("README.md lost the mcp-name marker the registry validates against")
          PY

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: "3.11"

      - run: uv sync --locked --extra dev --extra connect --extra mcp

      # A version on PyPI is burned even after a yank, so the irreversible step
      # gets the gate: no green suite, no publish. ci.yml runs the same command
      # on PRs; duplicated on purpose, because a tag can be pushed onto a commit
      # no PR ever covered.
      - name: Test before anything irreversible
        run: uv run pytest -q

      - name: Build sdist and wheel
        # The rm is not tidiness: `files: dist/*` below attaches everything in
        # here, and uv build writes a .gitignore that reached the v0.5.0
        # release as an asset named default.gitignore. Excluding it there would
        # mean listing the artifacts by name, which is a second way for the
        # release to fail when one of them is not matched.
        run: uv build && rm -f dist/.gitignore

      - name: Verify built version matches the tag
        run: ls -1 dist/ && uv run python -c "import pathlib,sys; t='${{ github.ref_name }}'.lstrip('v'); files=[p.name for p in pathlib.Path('dist').glob('*.whl')]; sys.exit(0 if any(t.replace('-','_') in f for f in files) else f'tag {t} not in {files}')"

      - name: Verify the wheel ships the skill
        # Guards the package-data config: `silica setup` copies SKILL.md out of
        # the installed package, and a wheel that drops it fails at runtime.
        run: |
          unzip -l dist/*.whl | grep -q "silica/skills/silica/SKILL.md" || { echo "MISSING from wheel: SKILL.md"; exit 1; }

      - name: Publish to PyPI
        # Trusted Publishing via OIDC — the PyPI project must have this repo +
        # workflow registered as a trusted publisher. No API token in secrets.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2

      - name: Generate release notes
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5  # v4.8.0
        id: notes
        with:
          config: cliff.toml
          args: --latest --strip header

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          body: ${{ steps.notes.outputs.content }}
          files: dist/*
          fail_on_unmatched_files: true

  # The registry is the feed Glama, the client directories and PulseMCP ingest,
  # so the tag that reaches PyPI should reach it too. Its own job rather than a
  # step above: the registry is in preview and flakes, and a failed job can be
  # re-run alone, while re-running `release` would try to publish a version PyPI
  # already has and die on the first irreversible step.
  registry:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # OIDC login to the registry (no token in secrets)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Pinned by release for the reason the actions above are pinned by commit:
      # this binary runs holding a token that can publish under io.github.kiycoh.
      - name: Install mcp-publisher
        run: |
          curl -fsSL https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz \
            | tar xz mcp-publisher

      - name: Authenticate to the MCP registry
        run: ./mcp-publisher login github-oidc

      # Validation reads the mcp-name marker out of the description PyPI renders
      # for THIS version, and PyPI takes a moment to serve a release it has just
      # accepted. Three tries, then it is a real failure: re-run this job, or run
      # `mcp-publisher publish` from a checkout of the tag.
      - name: Publish to the MCP registry
        run: |
          for attempt in 1 2 3; do
            ./mcp-publisher publish && exit 0
            echo "attempt $attempt failed; giving PyPI time to serve the new version"
            sleep 20
          done
          exit 1
